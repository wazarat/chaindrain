[project]
name = "chaindrain-api"
version = "0.1.0"
description = "Chaindrain FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "httpx>=0.27.0",
  "python-jose[cryptography]>=3.3.0",
  "supabase>=2.7.0",
  "psycopg[binary]>=3.2.0",
  "sqlalchemy>=2.0.31",
  "alembic>=1.13.2",
  "asyncpg>=0.29.0",
  "slowapi>=0.1.9",
  "sentry-sdk[fastapi]>=2.10.0",
  "python-multipart>=0.0.9",
  "orjson>=3.10.7",
  "tenacity>=8.5.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6.0",
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "pytest-asyncio>=0.23.0",
  "datamodel-code-generator>=0.25.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's idiomatic dependency-injection helpers must be called in arg defaults.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Body",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Form",
  "fastapi.File",
  "fastapi.Security",
]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
