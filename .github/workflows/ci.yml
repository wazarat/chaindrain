name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"

jobs:
  mvp:
    name: mvp lint + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install (workspace)
        run: pnpm install --no-frozen-lockfile
      - name: Lint
        run: pnpm --filter @chaindrain/mvp lint
      - name: Typecheck
        run: pnpm --filter @chaindrain/mvp typecheck
      - name: Test
        run: pnpm --filter @chaindrain/mvp test

  shared-types-typecheck:
    name: shared-types typecheck (legacy)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install (workspace)
        run: pnpm install --no-frozen-lockfile
      - name: Typecheck
        run: pnpm --filter @chaindrain/shared-types typecheck

# Removed in Phase 3 cleanup (commit on 2026-05-16):
# - api-lint / agent-lint — apps/api + apps/agent were deleted in Phase 0
# - web-lint-typecheck    — apps/web is frozen; the mvp job above is the
#                            canonical lint+typecheck surface
# - migrate-check / rls-audit — never reinstated after the Phase-0 rewrite;
#                                see scripts/rls_audit.sql + the live MCP
#                                path for the equivalent check.
