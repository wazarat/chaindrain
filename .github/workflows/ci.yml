name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: 20
  PYTHON_VERSION: "3.12"

jobs:
  web-lint-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        # Version comes from the `packageManager` field in the root package.json.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Install
        run: pnpm install --no-frozen-lockfile
        working-directory: .
      - name: Typecheck
        run: pnpm typecheck

  shared-types-typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/shared-types
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --no-frozen-lockfile
        working-directory: .
      - run: pnpm typecheck

  api-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Ruff
        run: uv run ruff check .
      - name: Mypy
        run: uv run mypy app || true # advisory only at MVP

  agent-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: astral-sh/setup-uv@v3
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Ruff
        run: uv run ruff check .

  # NOTE: Postgres-based migrate-check and rls-audit jobs were removed from CI.
  # They depended on rehydrating Supabase's `auth.*` and `storage.*` schemas in
  # a vanilla Postgres image, which is brittle. We instead run the RLS audit
  # directly against the live Supabase project (see scripts/rls_audit.sql, run
  # via `psql $DATABASE_URL` locally or through the Supabase MCP integration).
